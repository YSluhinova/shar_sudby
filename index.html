<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Магический шар предсказаний онлайн. Задай вопрос — получи ответ. Работает 24/7, бесплатно и анонимно.">
    <title>Онлайн предсказатель | Задай вопрос и получи ответ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee:wght@400&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            font-family: 'Georgia', serif;
            overflow-x: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .stage {
            width: 360px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .logo {
            width: 100%;
            max-width: 550px;
            height: 90px;
            background-image: url('shar_2.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .subtitle {
            font-size: 14px;
            color: rgba(0,0,0,0.5);
            text-align: center;
            margin: 20px 10px;
            line-height: 1.4em;
        }
        #ball {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle at top, #5dade2 0%, #1f618d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 1px 5px 20px rgba(0,0,0,0.9);
            cursor: pointer;
            user-select: none;
            margin: 15px 0;
        }
        #ball-text {
            font-family: "Bungee", 'Georgia', serif;
            font-size: 30px;
            color: #fff;
            text-shadow: 1px 5px 3px rgba(0,0,0,0.3);
        }
        .reset-button {
            margin: 20px 0;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #f4a3c4;
            background-image: url('reset.png');
            background-size: 60%;
            background-repeat: no-repeat;
            background-position: center;
            border: 1.5px solid rgba(255,255,255,0.4);
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.35);
            transition: transform 0.15s ease;
        }
        .reset-button:active {
            transform: scale(0.85);
        }
        #ad, #telegram, #copyright {
            text-align: center;
            margin: 10px 0;
        }
        #ad a, #copyright {
            font-size: 10px;
            font-family: "Arial", sans-serif;
            color: rgba(0,0,0,0.3);
            text-decoration: none;
        }
        #telegram a {
            font-size: 14px;
            font-weight: bold;
            color: #6dade2;
            text-decoration: none;
        }
        /* Десктоп: увеличиваем сцену */
        @media (min-width: 600px) {
            .stage {
                transform: scale(1.3);
                transform-origin: center center;
            }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="logo"></div>
        <h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0);">Шар судьбы — онлайн предсказатель</h1>
        <div class="subtitle">
            Получайте предсказания с помощью ответов,<br>которые выберет шар.
            Задайте вопрос.<br>
            Нажмите на шар — получите ответ:<br>
            «Да» или «Нет»
        </div>
        <div id="ball">
            <span id="ball-text">?</span>
        </div>
        <div class="reset-button" aria-label="reset"></div>
        <div id="ad">
            <a href="mailto:xx77@inbox.ru">Здесь может быть ваша реклама.<br>*Контент несёт чисто информационный характер</a>
        </div>
        <div id="telegram">
            <a href="https://t.me/sharrSudby_bot" target="_blank">Telegram</a>
        </div>
        <div id="copyright">
            <p>© ВПЗ. 2026</p>
        </div>
    </div>
    <script>
        const ball = document.getElementById('ball');
        const ballText = document.getElementById('ball-text');
        const resetButton = document.querySelector('.reset-button');
        const answers = ["Да", "Нет"];
        let isAnswered = false;

        function showAnswer(text) {
            ballText.style.opacity = "0";
            setTimeout(() => {
                ballText.textContent = text;
                ballText.style.opacity = "1";
            }, 300);
        }

        ball.addEventListener('click', () => {
            if (isAnswered) return;
            isAnswered = true;
            const answer = answers[Math.floor(Math.random() * answers.length)];
            showAnswer(answer);
        });

        resetButton.addEventListener('click', () => {
            ballText.style.opacity = "0";
            setTimeout(() => {
                ballText.textContent = "?";
                ballText.style.opacity = "1";
                isAnswered = false;
            }, 300);
        });
    </script>
</body>
</html>
